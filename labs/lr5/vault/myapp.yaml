apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-sa
  namespace: lr5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: lr5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lr5-myapp
  template:
    metadata:
      labels:
        app: lr5-myapp
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "myapp"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/myapp/config"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/myapp/config" -}}
          username={{ .Data.data.username }}
          password={{ .Data.data.password }}
          {{- end }}
    spec:
      serviceAccountName: myapp-sa
      containers:
        - name: app
          image: nginx:1.28-alpine
          command: ["/bin/sh", "-c"]
          args: ["test -s /vault/secrets/config && echo 'Vault secret file is present' && sleep 86400"]
