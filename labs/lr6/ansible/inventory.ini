[webservers]
web1 ansible_host=127.0.0.1 ansible_port=22261
web2 ansible_host=127.0.0.1 ansible_port=22262

[dbservers]
db1 ansible_host=127.0.0.1 ansible_port=22263

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=.local-ssh/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.local-ssh/known_hosts
