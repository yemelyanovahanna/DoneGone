services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: donegone_ci
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?Set CI_DB_PASSWORD}
      POSTGRES_DB: donegone_ci
    volumes:
      - ci_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: ${BACKEND_IMAGE_REF:-donegone-api-backend:stage3}
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://donegone_ci:${CI_DB_PASSWORD}@db:5432/donegone_ci
      JWT_SECRET: ${CI_JWT_SECRET:?Set CI_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
  frontend:
    image: ${FRONTEND_IMAGE_REF:-donegone-api-frontend:stage3}
    ports:
      - "127.0.0.1::80"
    depends_on:
      - backend
volumes:
  ci_postgres_data:
